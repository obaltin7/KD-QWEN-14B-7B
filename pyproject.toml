[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdq"
version = "0.1.0"
description = "Qwen2.5-14B-Instruct -> Qwen2.5-7B-Instruct knowledge distillation experiment (GSM8K)"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Slow end-to-end training tests are skipped by default; to run them: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: end-to-end training with mock models (slow); run with pytest -m slow"]
